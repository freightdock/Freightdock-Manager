[package]
name = "freightdock-manager"
description = "Freightdock's manager-agent: the cluster's control plane. Owns cluster state, enrols workers and commands them."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/freightdock/Manager"
rust-version = "1.90"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
freightdock-proto = { path = "../Freightdock-Contracts" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
rand = "0.9"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
socket2 = "0.6"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
x509-parser = "0.18"
yaml_serde = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
openraft = { version = "0.10", default-features = false, features = ["tokio-rt", "serde"] }

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
overflow-checks = true
